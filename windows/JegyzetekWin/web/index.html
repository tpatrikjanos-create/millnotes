<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>MillNotes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-112 -112 224 224'%3E%3Crect x='-112' y='-112' width='224' height='224' rx='48' fill='%230B1220'/%3E%3Cg fill='%233B82F6'%3E%3Ccircle r='86' fill='none' stroke='%233B82F6' stroke-width='10'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(45)'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(90)'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(135)'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(180)'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(225)'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(270)'/%3E%3Crect x='-10' y='-80' width='20' height='50' rx='3' transform='rotate(315)'/%3E%3Ccircle r='18'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B1220;--panel:#0F1829;--panel2:#15213A;--panel3:#1B2947;--line:#1E2B45;--line2:#2A3A5C;
  --text:#E8EEF8;--muted:#A3B1CA;--dim:#7788A8;
  --acc:#3B82F6;--acc2:#60A5FA;--accs:#2563EB;--water:#7DD3FC;
  --ok:#34D399;--warn:#FBBF24;--bad:#F87171;
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);
  --font:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:11px/1 ui-monospace,Consolas,monospace;color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:3px 5px}

/* ===== Elrendezés ===== */
.app{height:100%;display:grid;grid-template-columns:256px 352px minmax(0,1fr);position:relative}
nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 10px 10px;overflow:auto}
#listPane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
#docPane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.scrim{display:none}

/* ===== Navigáció ===== */
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.wheel{width:34px;height:34px;color:var(--acc);flex:none;transition:color .3s,opacity .3s}
.wheel.spin{animation:spin 1.6s linear infinite}
.wheel.off{color:var(--dim);opacity:.7}
.wheel.bad{color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-size:17px;letter-spacing:-.01em}
.brand small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:11px 12px;background:var(--accs);color:#fff;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(37,99,235,.28);transition:transform .15s var(--ease),filter .15s}
.newbtn:hover{filter:brightness(1.08)}
.newbtn:active{transform:scale(.98)}
.cmdbtn{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:9px 10px;color:var(--muted);font-size:13px;text-align:left}
.cmdbtn:hover{border-color:var(--line2);color:var(--text)}
.cmdbtn kbd{margin-left:auto}
.nitem{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:10px;padding:8px 10px;background:transparent;font-size:14px;text-align:left;color:var(--muted);transition:background .15s,color .15s}
.nitem:hover{background:var(--panel2);color:var(--text)}
.nitem.on{background:var(--panel3);color:var(--text)}
.nitem .n{margin-left:auto;font-size:12px;color:var(--dim)}
.lbl{display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim);padding:16px 10px 6px}
.lbl button{margin-left:auto;border:0;background:transparent;color:var(--dim);border-radius:8px;width:24px;height:24px;display:grid;place-items:center}
.lbl button:hover{background:var(--panel2);color:var(--text)}
.tnode{display:flex;align-items:center;border-radius:10px;transition:background .15s}
.tnode:hover{background:var(--panel2)}
.tnode.on{background:var(--panel3)}
.tnode.drop,.frow.drop,.nitem.drop{background:rgba(59,130,246,.18);box-shadow:inset 0 0 0 1px var(--acc)}
.car{width:22px;height:30px;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;flex:none;padding:0}
.car svg{width:14px;height:14px;transition:transform .2s var(--ease)}
.car.open svg{transform:rotate(90deg)}
.tlink{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 8px 6px 0;font-size:14px;text-align:left;color:var(--muted)}
.tnode.on .tlink,.tnode:hover .tlink{color:var(--text)}
.tlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink svg{color:var(--acc2)}
.tagbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);margin:0 6px 6px 0}
.tagbtn:hover,.tagbtn.on{border-color:var(--acc);color:var(--text);background:rgba(59,130,246,.12)}
.tags{padding:2px 8px}
.navfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}

/* ===== Lista ===== */
.lhead{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:8px}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--panel2);color:var(--text)}
.ib.on{color:var(--acc2)}
.hamb,.back{display:none}
.crumbs{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;min-height:16px}
.crumbs button{border:0;background:transparent;padding:0;color:var(--muted);font-size:12px}
.crumbs button:hover{color:var(--text);text-decoration:underline}
.ltitle{flex:1;min-width:0;font-size:22px;font-weight:650;letter-spacing:-.02em;margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcount{font-size:12px;color:var(--dim);margin-top:2px}
.searchbox{position:relative;margin-top:12px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px 9px 36px;outline:none;font-size:14px;transition:border-color .15s}
.search:focus{border-color:var(--acc)}
.list{flex:1;min-height:0;overflow:auto;padding:10px 10px 90px}
.frow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;color:var(--text);transition:background .15s}
.frow:hover{background:var(--panel2)}
.frow svg.i{color:var(--acc2)}
.frow .n{margin-left:auto;font-size:12px;color:var(--dim)}
.frow .chev{color:var(--dim);width:16px;height:16px}
.card{display:block;width:100%;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:12px 14px;text-align:left;margin-bottom:4px;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.card:hover{background:var(--panel)}
.card.on{background:var(--panel2);border-color:var(--line2)}
.card.new{animation:in .35s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ct{display:flex;align-items:center;gap:8px;min-width:0}
.ctitle{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ctitle.empty{color:var(--dim);font-weight:500}
.ct svg.i{width:15px;height:15px;color:var(--acc2)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.cs{font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cm{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--dim);margin-top:8px}
.chip{border-radius:999px;background:rgba(96,165,250,.12);color:var(--acc2);padding:2px 8px;font-size:11px}
mark{background:rgba(251,191,36,.28);color:inherit;border-radius:3px;padding:0 1px}
.sect{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim);padding:12px 12px 6px}
.empty{padding:48px 24px;text-align:center;color:var(--dim);font-size:14px;line-height:1.6}
.empty .wheel{width:72px;height:72px;color:var(--panel3);margin:0 auto 14px;display:block}
.fab{display:none}
.trashrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px}
.trashrow:hover{background:var(--panel)}
.trashrow .tn{flex:1;min-width:0}
.trashrow .tn b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trashrow .tn small{font-size:12px;color:var(--dim)}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
.mini:hover{color:var(--text);border-color:var(--line2)}
.mini.bad:hover{color:var(--bad);border-color:var(--bad)}

/* ===== Szerkesztő ===== */
.dhead{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:57px}
.dpath{flex:1;min-width:0;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.dscroll{flex:1;min-height:0;overflow:auto}
.col{max-width:760px;margin:0 auto;padding:28px 32px 120px}
.dtitle{width:100%;background:transparent;border:0;outline:none;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.2;padding:0;color:var(--text)}
.dtitle::placeholder{color:var(--line2)}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:10px 0 18px}
.tbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;padding:6px;margin:0 -6px 8px;background:rgba(11,18,32,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px}
.tbar .ib{width:34px;height:34px;font-weight:700;font-size:14px}
.tsep{width:1px;height:20px;background:var(--line);margin:0 4px}
.seg{margin-left:auto;display:flex;background:var(--panel);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--text)}
textarea.doc{display:block;width:100%;min-height:55vh;resize:none;overflow:hidden;background:transparent;border:0;outline:none;font-size:17px;line-height:1.75;padding:6px 0;color:#D5DEEC;caret-color:var(--acc2)}
textarea.doc::placeholder{color:var(--dim)}
.prev{font-size:17px;line-height:1.75;color:#D5DEEC;padding:6px 0;word-wrap:break-word;min-height:40vh}
.prev h1,.prev h2,.prev h3{color:var(--text);letter-spacing:-.02em;line-height:1.3;margin:18px 0 6px}
.prev h1{font-size:26px}.prev h2{font-size:21px}.prev h3{font-size:18px}
.prev p{margin:0}
.prev .sp{height:14px}
.prev ul,.prev ol{margin:4px 0;padding-left:24px}
.prev ul.chk{list-style:none;padding-left:2px}
.prev li.task{display:flex;align-items:flex-start;gap:10px}
.prev li.task.done span{color:var(--dim);text-decoration:line-through}
.cb{width:20px;height:20px;margin-top:5px;flex:none;border-radius:6px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.cb[aria-pressed="true"]{background:var(--accs);border-color:var(--accs)}
.cb svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3}
.prev code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--panel2);border-radius:6px;padding:2px 6px}
.prev blockquote{margin:6px 0;padding:2px 0 2px 14px;border-left:3px solid var(--line2);color:var(--muted)}
.prev hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.prev a{color:var(--acc2)}
.prev .tag,.tagtxt{color:var(--acc2);cursor:pointer}
.dfoot{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding:9px 18px}
.dfoot b{color:var(--muted);font-weight:500}
.dfoot .st{margin-left:auto;display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pulse.w{background:var(--warn)}
.pulse.b{background:var(--bad)}
.trashbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:12px 14px;border-radius:12px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);font-size:13px;color:var(--muted)}
.trashbar span{flex:1}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--dim)}
.welcome .wheel{width:110px;height:110px;color:var(--panel3);margin-bottom:22px;animation:spin 40s linear infinite}
.welcome h2{color:var(--text);font-size:22px;letter-spacing:-.02em;margin:0 0 8px}
.welcome p{margin:0 0 20px;font-size:14px}
.keys{display:grid;grid-template-columns:auto auto;gap:8px 14px;font-size:13px;text-align:left}

/* ===== Fókusz mód ===== */
.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus nav,.app.focus #listPane{display:none}
.app.focus .col{max-width:720px;padding-top:56px}

/* ===== Lebegő elemek ===== */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);display:flex;align-items:center;gap:14px;background:#17233D;border:1px solid var(--line2);padding:10px 12px 10px 16px;border-radius:14px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:90;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--acc2);font-weight:600;padding:4px 6px;border-radius:8px}
.toast button:hover{background:var(--panel3)}
.ov{position:fixed;inset:0;background:rgba(4,8,16,.62);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.ov.show{display:flex}
.dlg{width:min(460px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .22s var(--ease)}
.dlg.wide{width:min(820px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dlg h3{margin:0 0 12px;font-size:18px;font-weight:650;letter-spacing:-.01em}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.55}
.dlg h4{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;color:var(--dim)}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;font-size:14px}
.field:focus{border-color:var(--acc)}
textarea.field{min-height:200px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.plist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--bg)}
.pick{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:10px;padding:8px;font-size:14px;text-align:left}
.pick:hover{background:var(--panel)}
.pick.on{background:var(--panel3)}
.pick svg{color:var(--acc2)}
.row2{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:9px 16px;font-size:14px;transition:filter .15s,border-color .15s}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--accs);border-color:var(--accs);color:#fff;font-weight:600}
.btn.bad{background:#B91C1C;border-color:#B91C1C;color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:180px;font-size:14px;word-break:break-all}
.warnbox{font-size:13px;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.hist{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;min-height:320px}
.hlist{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:52vh;padding:6px;background:var(--bg)}
.hitem{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:9px 10px;font-size:13px}
.hitem:hover{background:var(--panel)}
.hitem.on{background:var(--panel3)}
.hitem small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.hprev{border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:52vh;white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--muted);background:var(--bg)}
.menu{position:fixed;z-index:80;min-width:200px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:pop .16s var(--ease)}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-size:14px;text-align:left}
.mi:hover,.mi:focus-visible{background:var(--panel3)}
.mi.danger{color:var(--bad)}
.mi .ck{margin-left:auto;color:var(--acc2)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.swatch{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line2)}
.pal{position:fixed;inset:0;z-index:75;background:rgba(4,8,16,.55);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal.show{display:flex}
.palbox{width:min(600px,100%);background:var(--panel2);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;animation:pop .18s var(--ease)}
.palin{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;padding:16px 18px;font-size:16px}
.palres{max-height:52vh;overflow:auto;padding:6px}
.pi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;font-size:14px}
.pi.on{background:var(--panel3)}
.pi svg.i{color:var(--acc2)}
.pi small{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:95;padding:20px}
.gate .dlg{width:min(420px,100%);text-align:left}
.gate .wheel{width:64px;height:64px;margin-bottom:14px;animation:spin 12s linear infinite}

/* ===== Közepes szélesség: a mappák behúzható panelben ===== */
@media (max-width:1099px){
  .app{grid-template-columns:340px minmax(0,1fr)}
  nav{position:fixed;top:0;bottom:0;left:0;z-index:60;width:286px;transform:translateX(-105%);transition:transform .28s var(--ease);box-shadow:16px 0 50px rgba(0,0,0,.5)}
  nav.open{transform:none}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
const live = i => i && !i.trashedAt;
const nameOf = i => (i && i.name) || (i && i.type === "folder" ? "Névtelen mappa" : "Névtelen jegyzet");
const parentOk = i => i.parentId && items[i.parentId] && items[i.parentId].type === "folder";
const pid = i => (parentOk(i) ? i.parentId : null);   // árva elem a gyökérbe kerül
const docs = () => Object.values(items).filter(i => i.type === "doc" && live(i));
const kids = p => Object.values(items).filter(i => pid(i) === p && live(i));
const folders = p => kids(p).filter(i => i.type === "folder").sort((a, b) => nameOf(a).localeCompare(nameOf(b), "hu"));
const topTrashed = () => Object.values(items).filter(i => i.trashedAt && !(parentOk(i) && items[i.parentId].trashedAt));

const crumbs = id => { const o = []; let c = id, n = 0; while (c && items[c] && n++ < 200) { o.unshift(items[c]); c = parentOk(items[c]) ? items[c].parentId : null; } return o; };

const words = s => (s || "").trim().split(/\s+/).filter(Boolean).length;
const colorOf = id => COLORS.find(c => c.id === id) || COLORS[0];

async function connect() {
  if (!CFG.databaseURL) { conn = "nourl"; syncUI(); return; }

    content: "## Gyorsbillentyűk\n- **Ctrl+K**: keresés és parancsok\n- **Ctrl+E**: olvasó és szerkesztő nézet\n- **Ctrl+B / Ctrl+I**: félkövér, dőlt\n\n## Rendszerezés\n- Húzd a jegyzetet egy mappára az áthelyezéshez\n- A törölt elemek 30 napig a lomtárban maradnak\n- Minden jegyzetnek van előzménye a ⋯ menüben\n\n#ötletek" };
  items[f.id] = f; items[d.id] = d; items[t.id] = t; queue(f.id); queue(d.id); queue(t.id);

/* ===== Módosítások ===== */
function save(id) {
  const it = items[id]; if (!it) return;
  if (!dirty.has(id)) it.base = known[id] || 0;      // melyik szerverváltozatra épül ez a módosítás
  it.modified = Date.now(); queue(id);
}
function uniqFolder(p, name, exceptId) {
  const taken = new Set(kids(p).filter(i => i.type === "folder" && i.id !== exceptId).map(nameOf));
  if (!taken.has(name)) return name;
  let n = 2; while (taken.has(`${name} (${n})`)) n++;
  return `${name} (${n})`;
}
function create(type, name, p, content = "") {
  const id = uid(), now = Date.now();
  items[id] = { id, type, parentId: p || null, name: type === "folder" ? uniqFolder(p || null, name, null) : name, content, modified: now, created: now, trashedAt: null, pinned: false, color: "", snapAt: now, base: 0 };
  if (p) S.open.add(p);
  queue(id);
  return id;
}
function walk(id, fn, n = 0) { if (n > 200) return; fn(id); for (const c of Object.values(items)) if (c.parentId === id) walk(c.id, fn, n + 1); }
function trash(id) {
  const ts = Date.now();
  walk(id, x => { if (!items[x].trashedAt) { items[x].trashedAt = ts; items[x].modified = ts; queue(x); } });
  return ts;
}
function restore(id) {
  const root = items[id]; if (!root) return;
  const ts = root.trashedAt, now = Date.now();
  walk(id, x => { if (items[x].trashedAt === ts) { items[x].trashedAt = null; items[x].modified = now; queue(x); } });
  if (root.parentId && (!items[root.parentId] || items[root.parentId].trashedAt)) { root.parentId = null; save(root.id); }
}
function hardDelete(id) { walk(id, x => { if (items[x]?.type === "doc") queuePath("hist/" + x, null); delete items[x]; queue(x); }); }
function move(id, target) {
  if (!items[id] || id === target || (target && inside(target, id))) return false;
  if ((items[id].parentId || null) === (target || null)) return true;
  items[id].parentId = target || null;
  if (items[id].type === "folder") items[id].name = uniqFolder(target || null, nameOf(items[id]), id);
  save(id);
  return true;
}
function purge() {
  const cut = Date.now() - PURGE;
  for (const it of Object.values(items)) if (it.trashedAt && it.trashedAt < cut && items[it.id]) hardDelete(it.id);
}
function importText(txt, dest) {
  const blocks = txt.split(/^\s*---\s*$/m).map(b => b.trim()).filter(Boolean);
  for (const b of blocks) {
    const lines = b.split("\n");
    const title = lines.shift().trim().slice(0, 120) || "Importált jegyzet";
    create("doc", title, dest, lines.join("\n").trim());
  }
  return blocks.length;
}

/* ===== Fájlok, megosztás ===== */
function download(name, data, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const today = () => new Date().toISOString().slice(0, 10);
function exportJson() {
  const data = JSON.stringify({ app: "jegyzetek", version: 2, exportedAt: new Date().toISOString(), items: Object.values(items) }, null, 2);
  const name = `millnotes-${today()}.json`;
  if (window.AndroidBridge && AndroidBridge.saveFile) AndroidBridge.saveFile(name, data);
  else { download(name, data, "application/json"); toast("Export elkészült"); }
}
const fileSafe = s => (s || "jegyzet").replace(/[\\/:*?"<>|]+/g, "-").slice(0, 80);
function exportMd(d) {
  const data = `# ${nameOf(d)}\n\n${d.content || ""}\n`, name = fileSafe(nameOf(d)) + ".md";
  if (window.AndroidBridge && AndroidBridge.saveText) AndroidBridge.saveText(name, data);
  else { download(name, data, "text/markdown"); toast("Markdown-fájl elkészült"); }
}
async function shareDoc(d) {
  const text = `${nameOf(d)}\n\n${d.content || ""}`;
  if (window.AndroidBridge && AndroidBridge.shareText) { AndroidBridge.shareText(nameOf(d), text); return; }
  if (navigator.share) { try { await navigator.share({ title: nameOf(d), text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("A jegyzet a vágólapra került"); } catch (e) { toast("A megosztás itt nem érhető el"); }
}
function openUrl(u) {
  if (window.AndroidBridge && AndroidBridge.openUrl) AndroidBridge.openUrl(u);
  else window.open(u, "_blank", "noopener");
}
function importJson() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const arr = Array.isArray(j) ? j : (j.items ? Object.values(j.items) : []);
      let n = 0;
      for (const raw of arr) {
        const r = norm(raw); if (!r) continue;
        const l = items[r.id];
        if (!l || r.modified > (l.modified || 0)) { items[r.id] = r; queue(r.id); n++; }
      }
      render(); toast(`${n} elem importálva`);
    } catch (e) { toast("Hibás JSON-fájl"); }
  };
  inp.click();
}

/* ===== Párbeszédablakok, menük, értesítések ===== */
let closeModal = null;
function modal({ title, body = "", ok = "OK", bad = false, read = null, onOpen = null, cancel = "Mégse", noOk = false, wide = false }) {
  if (closeModal) closeModal(null);
  return new Promise(resolve => {
    const ov = $("#ov");
    ov.innerHTML = `<div class="dlg ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}<div class="row2"><button class="btn" data-x>${esc(cancel)}</button>${noOk ? "" : `<button class="btn ${bad ? "bad" : "pri"}" data-ok>${esc(ok)}</button>`}</div></div>`;
    ov.classList.add("show");
    const prevFocus = document.activeElement;
    const close = r => {
      if (closeModal !== close) return;
      closeModal = null; ov.classList.remove("show"); ov.innerHTML = ""; resolve(r);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus();
    };
    closeModal = close;
    ov.onclick = e => { if (e.target === ov) close(null); };
    ov.querySelector("[data-x]").onclick = () => close(null);
    const okb = ov.querySelector("[data-ok]");
    if (okb) okb.onclick = () => { const r = read ? read(ov) : { v: true }; if (r) close(r); };
    if (onOpen) onOpen(ov, close); else (okb || ov.querySelector("[data-x]")).focus();
  });
}
const confirmBox = (title, text, ok, bad = false) => modal({ title, body: `<p>${esc(text)}</p>`, ok, bad });
async function askText(title, val = "", ok = "Mentés") {
  const r = await modal({
    title, ok,
    body: `<input class="field" id="mv" value="${esc(val)}" maxlength="120" aria-label="${esc(title)}">`,
    onOpen: ov => { const i = ov.querySelector("#mv"); i.focus(); i.select(); i.onkeydown = e => { if (e.key === "Enter") ov.querySelector("[data-ok]").click(); }; },
    read: ov => { const v = ov.querySelector("#mv").value.trim(); return v ? { v } : null; }
  });
  return r ? r.v : null;
}
async function pickFolder(exclude) {
  let sel = null;
  const tree = (p, d) => folders(p).filter(f => f.id !== exclude)
    .map(f => `<button class="pick" data-pick="${f.id}" style="padding-left:${8 + d * 16}px">${I.folder}<span>${esc(nameOf(f))}</span></button>` + tree(f.id, d + 1)).join("");
  return modal({
    title: "Áthelyezés ide", ok: "Áthelyezés",
    body: `<div class="plist"><button class="pick" data-pick="root">${I.home}<span>Jegyzetek (főmappa)</span></button>${tree(null, 1)}</div>`,
    read: () => sel,
    onOpen: ov => { ov.querySelectorAll("[data-pick]").forEach(n => n.onclick = () => {
      ov.querySelectorAll("[data-pick]").forEach(x => x.classList.remove("on"));
      n.classList.add("on"); sel = { v: n.dataset.pick === "root" ? null : n.dataset.pick };
    }); ov.querySelector("[data-pick]").focus(); }

}

let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; document.removeEventListener("pointerdown", menuOutside, true); } }
function menuOutside(e) { if (openMenu && !openMenu.contains(e.target)) closeMenu(); }
function menu(anchor, entries) {
  const was = openMenu && openMenu._anchor === anchor;
  closeMenu(); if (was) return;
  const m = document.createElement("div");
  m.className = "menu"; m.setAttribute("role", "menu"); m._anchor = anchor;
  m.innerHTML = entries.map((e, i) => e === "-" ? '<div class="msep"></div>' :
    `<button role="menuitem" class="mi ${e.danger ? "danger" : ""}" data-mi="${i}">${e.icon || ""}<span>${esc(e.label)}</span>${e.checked ? '<span class="ck">✓</span>' : ""}</button>`).join("");
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  m.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  m.onclick = ev => { const b = ev.target.closest("[data-mi]"); if (!b) return; closeMenu(); entries[+b.dataset.mi].act(); };
  m.onkeydown = ev => {
    const bs = [...m.querySelectorAll(".mi")], i = bs.indexOf(document.activeElement);
    if (ev.key === "ArrowDown") { ev.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (ev.key === "ArrowUp") { ev.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  };
  openMenu = m;
  setTimeout(() => document.addEventListener("pointerdown", menuOutside, true));
  m.querySelector(".mi")?.focus();
}

let toastT;
function toast(m, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(m)}</span>` + (action ? `<button>${esc(action.label)}</button>` : "");
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); action.fn(); };
  t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), action ? 6000 : 2400);
}

/* ===== Szinkronjelző: a malomkerék forog, amíg mentés zajlik ===== */
function syncState() {
  const n = pending();
  if (conn === "nourl") return { w: "bad", t: "Nincs Firebase-cím", dot: "b" };
  if (conn === "denied") return { w: "bad", t: "Jelentkezz be újra", dot: "b" };
  if (!navigator.onLine || conn === "error") return { w: "off", t: n ? `Offline · ${n} változás vár` : "Offline · helyben mentve", dot: "w" };
  if (conn === "connecting") return { w: "spin", t: "Kapcsolódás…", dot: "w" };

}

function sortDocs(arr) {
  const by = { modified: (a, b) => b.modified - a.modified, created: (a, b) => b.created - a.created, name: (a, b) => nameOf(a).localeCompare(nameOf(b), "hu") }[S.sort];
  return arr.sort((a, b) => (b.pinned - a.pinned) || by(a, b));
}

function cardHtml(d, opts = {}) {
  const c = colorOf(d.color), q = S.view === "search" ? S.q : "";

/* ===== Egyszerű Markdown-megjelenítés ===== */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" data-url="$1">$1</a>')
    .replace(TAG_RE, (m, a, t) => `${a}<span class="tag" data-tag="${t.toLowerCase()}">#${t}</span>`);
}
function md(src) {
  let out = "", list = null;
  const open = k => { if (list !== k) { close(); out += k === "chk" ? '<ul class="chk">' : `<${k}>`; list = k; } };
  const close = () => { if (list) { out += list === "chk" ? "</ul>" : `</${list}>`; list = null; } };
  (src || "").split("\n").forEach((ln, i) => {
    let m;
    if ((m = ln.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/))) {
      open("chk"); const on = m[1] !== " ";
      out += `<li class="task ${on ? "done" : ""}"><button class="cb" data-check="${i}" aria-pressed="${on}" aria-label="${on ? "Kész" : "Nincs kész"}">${on ? CHECK : ""}</button><span>${inline(m[2])}</span></li>`;
      return;
    }
    if ((m = ln.match(/^\s*[-*] (.*)$/))) { open("ul"); out += `<li>${inline(m[1])}</li>`; return; }
    if ((m = ln.match(/^\s*\d+[.)] (.*)$/))) { open("ol"); out += `<li>${inline(m[1])}</li>`; return; }
    close();
    if ((m = ln.match(/^(#{1,3}) (.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; return; }
    if (/^\s*---+\s*$/.test(ln)) { out += "<hr>"; return; }
    if ((m = ln.match(/^> ?(.*)$/))) { out += `<blockquote>${inline(m[1])}</blockquote>`; return; }
    out += ln.trim() ? `<p>${inline(ln)}</p>` : '<div class="sp"></div>';
  });
  close();
  return out || '<p style="color:var(--dim)">Üres jegyzet. Válts szerkesztésre a kezdéshez.</p>';
}

  const mk = m[3] ? `${+m[3] + 1}${m[4]} ` : m[2].replace(/\[[xX]\]/, "[ ]");

}
function fmtAct(f) {
  const ta = $("#dc"); if (!ta) return;
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  if (f === "b" || f === "i") {
    const mk = f === "b" ? "**" : "*", t = v.slice(a, b);
    replaceRange(ta, a, b, mk + (t || (f === "b" ? "félkövér" : "dőlt")) + mk);
    ta.setSelectionRange(a + mk.length, a + mk.length + (t || (f === "b" ? "félkövér" : "dőlt")).length);

  }

    const bare = l.replace(/^(#{1,3} |[-*] \[[ xX]\] |[-*] )/, "");

async function history(d) {

  let remote = [], offline = false;

  catch (e) { offline = true; }
  const list = [...local, ...remote].filter(h => h && h.content != null).sort((a, b) => b.t - a.t);
  let sel = null;
  const r = await modal({
    title: `Előzmények · ${nameOf(d)}`, ok: "Visszaállítás", wide: true,
    body: (offline ? `<div class="warnbox">Offline vagy, csak az ezen az eszközön készült előzmények látszanak.</div>` : "") +
      (list.length ? `<div class="hist"><div class="hlist">${list.map((h, i) => `<button class="hitem" data-h="${i}">${esc(fmt(h.t))}<small>${esc(h.why || "")}${h.local ? " · még nincs feltöltve" : ""}</small></button>`).join("")}</div><div class="hprev" id="hprev">Válassz egy változatot a bal oldalon.</div></div>`
        : `<p>Ehhez a jegyzethez még nincs előzmény. Szerkesztés közben legfeljebb 10 percenként és minden ütközéskor készül egy, jegyzetenként az utolsó ${HIST_KEEP} marad meg.</p>`),
    read: () => sel,
    onOpen: ov => {
      ov.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
        ov.querySelectorAll("[data-h]").forEach(x => x.classList.remove("on")); b.classList.add("on");
        const h = list[+b.dataset.h]; sel = { v: h }; ov.querySelector("#hprev").textContent = h.content;
      });
      const okb = ov.querySelector("[data-ok]"); if (!list.length && okb) okb.disabled = true;
      ov.querySelector("[data-h]")?.click();
    }
  });
  if (!r || !items[d.id]) return;
  const cur = items[d.id];
  snapshot(cur, cur.content, "Visszaállítás előtti állapot");
  cur.content = r.v.content; cur.snapAt = Date.now(); save(cur.id);
  if (cur.trashedAt) restore(rootTrashOf(cur.id));
  $("#docPane").dataset.key = ""; render(); toast("A korábbi változat visszaállítva");
}

/* ===== Parancspaletta (Ctrl+K) ===== */
let palSel = 0, palItems = [];
function palette() {
  closeMenu();
  const p = $("#pal"), inp = $("#palin");
  p.classList.add("show"); inp.value = ""; palRender(); inp.focus();
}
function palClose() { $("#pal").classList.remove("show"); }
function palRender() {
  const q = plainFold($("#palin").value.trim());
  const acts = [
    { l: "Új jegyzet", i: I.plus, f: () => newDoc() },
    { l: "Új mappa", i: I.folder, f: () => doAct("newFolder") },
    { l: "Kitűzött jegyzetek", i: I.pin, f: () => setView("pinned") },
    { l: "Legutóbbiak", i: I.clock, f: () => setView("recent") },
    { l: "Lomtár", i: I.trash, f: () => setView("trash") },
    { l: "Beállítások", i: I.gear, f: () => settings() },
    { l: "Beillesztés OneNote-ból", i: I.paste, f: () => doAct("paste") },
    { l: "Teljes export (JSON)", i: I.down, f: () => exportJson() }
  ];
  if (S.doc && items[S.doc] && !items[S.doc].trashedAt) acts.splice(2, 0,
    { l: "Fókusz mód", i: I.focus, f: () => setFocus(true) },
    { l: S.preview ? "Szerkesztő nézet" : "Olvasó nézet", i: I.edit, f: () => doAct(S.preview ? "edit" : "read") },
    { l: "Előzmények", i: I.hist, f: () => history(items[S.doc]) });
  let res = [];
  if (!q) {
    res = docs().sort((a, b) => b.modified - a.modified).slice(0, 5).map(d => ({ l: nameOf(d), s: rel(d.modified), i: I.doc, f: () => openDoc(d.id) })).concat(acts);
  } else {
    const ds = docs().filter(d => plainFold(d.name).includes(q) || plainFold(d.content).includes(q))
      .sort((a, b) => (plainFold(b.name).includes(q) - plainFold(a.name).includes(q)) || b.modified - a.modified).slice(0, 8);
    const fs = Object.values(items).filter(i => i.type === "folder" && live(i) && plainFold(i.name).includes(q)).slice(0, 4);
    const ts = allTags().filter(([t]) => plainFold(t).includes(q)).slice(0, 4);
    res = acts.filter(a => plainFold(a.l).includes(q))
      .concat(ds.map(d => ({ l: nameOf(d), s: pathOf(d), i: I.doc, f: () => { if (S.view === "trash") setView("folder"); openDoc(d.id); } })))
      .concat(fs.map(f => ({ l: nameOf(f), s: "Mappa", i: I.folder, f: () => goFolder(f.id) })))
      .concat(ts.map(([t, n]) => ({ l: "#" + t, s: `${n} jegyzet`, i: I.tag, f: () => setView("tag", { tag: t }) })));
  }
  palItems = res; palSel = 0;
  $("#palres").innerHTML = res.map((r, i) => `<button class="pi ${i === 0 ? "on" : ""}" data-pi="${i}" role="option">${r.i}<span>${esc(r.l)}</span>${r.s ? `<small>${esc(r.s)}</small>` : ""}</button>`).join("") ||
    '<div class="empty" style="padding:24px">Nincs találat</div>';
}
function palMove(n) {
  const bs = $("#palres").querySelectorAll(".pi"); if (!bs.length) return;
  palSel = (palSel + n + bs.length) % bs.length;
  bs.forEach((b, i) => b.classList.toggle("on", i === palSel)); bs[palSel].scrollIntoView({ block: "nearest" });
}
function palRun(i) { const it = palItems[i]; if (!it) return; palClose(); it.f(); }

/* ===== Események ===== */
document.addEventListener("click", e => {
  const t = e.target;
  const a = t.closest("a[data-url]"); if (a) { e.preventDefault(); openUrl(a.dataset.url); return; }
  const ck = t.closest("[data-check]"); if (ck) { toggleCheck(+ck.dataset.check); return; }
  const fm = t.closest("[data-fmt]"); if (fm) { fmtAct(fm.dataset.fmt); return; }
  const tog = t.closest("[data-tog]"); if (tog) { const id = tog.dataset.tog; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderNav(); return; }
  const act = t.closest("[data-act]"); if (act) { doAct(act.dataset.act, act); return; }
  const op = t.closest("[data-open]"); if (op) { openDoc(op.dataset.open); return; }
  const tg = t.closest("[data-tag]"); if (tg && !t.closest("#ov")) { setView("tag", { tag: tg.dataset.tag }); return; }
  const v = t.closest("[data-view]"); if (v) { setView(v.dataset.view); return; }
  const go = t.closest("[data-go]"); if (go) { goFolder(go.dataset.go === "root" ? null : go.dataset.go); return; }
  if (t.id === "scrim") closeNav();
  if (t.id === "pal") palClose();
});
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    S.q = e.target.value;
    if (S.q.trim()) { if (S.view !== "search") { S.prevView = { view: S.view, folder: S.folder, tag: S.tag }; } S.view = "search"; }
    else if (S.view === "search") Object.assign(S, S.prevView || { view: "folder" });
    renderList(); renderNav();
  }
  if (e.target.id === "palin") palRender();
});
$("#palin").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); palRun(palSel); }
  else if (e.key === "Escape") { e.preventDefault(); palClose(); }
});
$("#palres").addEventListener("click", e => { const b = e.target.closest("[data-pi]"); if (b) palRun(+b.dataset.pi); });
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); $("#pal").classList.contains("show") ? palClose() : palette(); return; }
  if (e.key === "Escape") {
    if (openMenu) { closeMenu(); return; }
    if (closeModal) { closeModal(null); return; }
    if ($("#pal").classList.contains("show")) { palClose(); return; }
    if (S.focus) { setFocus(false); return; }
    if ($("#nav").classList.contains("open")) { closeNav(); return; }
    if (e.target.id === "q" && S.q) { e.target.value = ""; e.target.dispatchEvent(new Event("input", { bubbles: true })); return; }
  }
  if (mod && e.key.toLowerCase() === "e" && S.doc && items[S.doc] && !items[S.doc].trashedAt && !closeModal) { e.preventDefault(); doAct(S.preview ? "edit" : "read"); }
});

/* Húzd és ejtsd: jegyzet vagy mappa áthelyezése egy mappára */
let dragId = null;
document.addEventListener("dragstart", e => { const d = e.target.closest?.("[data-drag]"); if (!d) return; dragId = d.dataset.drag; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", nameOf(items[dragId])); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); });
document.addEventListener("dragover", e => {
  if (!dragId) return;
  const z = e.target.closest("[data-drop]"); if (!z) return;
  const tgt = z.dataset.drop === "root" ? null : z.dataset.drop;
  if (tgt === dragId || (tgt && inside(tgt, dragId))) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drop").forEach(x => x !== z && x.classList.remove("drop"));
  if (z.id !== "list") z.classList.add("drop");
});
document.addEventListener("drop", e => {
  const z = e.target.closest("[data-drop]"); if (!z || !dragId) return;
  e.preventDefault();
  const tgt = z.dataset.drop === "root" ? null : z.dataset.drop, id = dragId;
  if (move(id, tgt)) { toast(`Áthelyezve ide: ${tgt ? nameOf(items[tgt]) : "Jegyzetek"}`); render(); }
});

window.addEventListener("online", () => { connect(); flush(); syncUI(); });
window.addEventListener("offline", syncUI);
window.addEventListener("resize", () => { if (!narrow()) $("#app").classList.toggle("docopen", !!S.doc); autosize(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) saveLocal(); else if (Date.now() - lastRemote > 60000 && conn !== "open") connect(); });
window.addEventListener("pagehide", saveLocal);

/* Android: vissza gomb, alvás előtti mentés, megosztott szöveg fogadása */
window.appBack = () => {
  if (openMenu) { closeMenu(); return true; }
  if (closeModal) { closeModal(null); return true; }
  if ($("#pal").classList.contains("show")) { palClose(); return true; }
  if (S.focus) { setFocus(false); return true; }
  if ($("#nav").classList.contains("open")) { closeNav(); return true; }
  if (S.doc && narrow()) { S.doc = null; render(); return true; }
  if (S.view === "search") { S.q = ""; Object.assign(S, S.prevView || { view: "folder" }); render(); return true; }
  if (S.view !== "folder") { setView("folder"); return true; }
  if (S.folder !== null) { goFolder(items[S.folder] ? pid(items[S.folder]) : null); return true; }
  return false;
};
window.appPause = () => { saveLocal(); flush(); };
window.appShareIn = (subject, text) => {
  text = String(text || "").trim(); subject = String(subject || "").trim();
  if (!text && !subject) return;
  const first = text.split("\n")[0].slice(0, 80);
  const title = subject || (/^https?:\/\//.test(first) ? "Megosztott link" : first) || "Megosztott jegyzet";
  const id = create("doc", title, null, title === text ? "" : text);
  setView("folder", { folder: null }); openDoc(id);
  toast("A megosztott szöveg új jegyzetként mentve");
};

/* ===== Belépés ===== */
/* ===== Fiók: e-mail és jelszó (Firebase Authentication REST) ===== */
let session = null, refreshing = null, loggingOut = false;
const loadSession = () => { try { return JSON.parse(lsGet("millnotes.auth") || "null"); } catch (e) { return null; } };
function saveSession(x) { session = x; lsSet("millnotes.auth", JSON.stringify(x)); }
async function authPost(op, body) {
  const r = await fetch(AUTH_URL + op + "?key=" + CFG.apiKey, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, returnSecureToken: true }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || "HTTP " + r.status);
  return j;
}
const AUTH_ERR = {
  EMAIL_EXISTS: "Ez az e-mail-cím már foglalt.",
  INVALID_LOGIN_CREDENTIALS: "Hibás e-mail-cím vagy jelszó.",
  INVALID_PASSWORD: "Hibás e-mail-cím vagy jelszó.",
  EMAIL_NOT_FOUND: "Hibás e-mail-cím vagy jelszó.",
  INVALID_EMAIL: "Érvénytelen e-mail-cím.",
  WEAK_PASSWORD: "A jelszó legalább 6 karakter legyen.",
  USER_DISABLED: "Ez a fiók le van tiltva.",
  TOO_MANY_ATTEMPTS_TRY_LATER: "Túl sok próbálkozás. Próbáld meg később."
};
const authMsg = e => AUTH_ERR[e.message] || "Nem sikerült: " + e.message;
async function signIn(email, password, signup) {
  const j = await authPost(signup ? "signUp" : "signInWithPassword", { email, password });
  saveSession({ uid: j.localId, email: j.email, idToken: j.idToken, refreshToken: j.refreshToken, expiresAt: Date.now() + (+j.expiresIn) * 1000 });
}
async function ensureToken() {
  if (!session) throw new Error("NOSESSION");
  if (session.expiresAt - Date.now() > 60000) return;
  if (!refreshing) refreshing = (async () => {
    const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(session.refreshToken) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error("REFRESH");
    saveSession({ ...session, idToken: j.id_token, refreshToken: j.refresh_token, expiresAt: Date.now() + (+j.expires_in) * 1000 });
  })().finally(() => { refreshing = null; });
  return refreshing;
}

function authGate() {
  return new Promise(res => {
    const g = document.createElement("div");
    g.className = "gate";
    let mode = "login";
    const draw = () => {
      g.innerHTML = `<div class="dlg">${wheel("live")}<h3>${mode === "login" ? "Bejelentkezés" : "Új fiók"}</h3>
        <p>${mode === "login" ? "Ezzel a fiókkal bármelyik eszközön látod a jegyzeteidet." : "A jegyzeteid a fiókodhoz tartoznak, más nem látja őket."}</p>
        <input class="field" id="em" type="email" placeholder="E-mail-cím" autocomplete="email" aria-label="E-mail-cím">
        <input class="field" id="pw" type="password" placeholder="Jelszó (legalább 6 karakter)" autocomplete="${mode === "login" ? "current-password" : "new-password"}" aria-label="Jelszó" style="margin-top:8px">
        <div id="gerr" class="warnbox" style="display:none;margin-top:10px"></div>
        <div class="row2" style="justify-content:space-between;margin-top:14px">
          <button class="btn" id="tg">${mode === "login" ? "Új fiók" : "Van már fiókom"}</button>
          <button class="btn pri" id="go">${mode === "login" ? "Belépés" : "Létrehozás"}</button>
        </div></div>`;
      const em = g.querySelector("#em"), pw = g.querySelector("#pw"), go = g.querySelector("#go");
      const showErr = m => { const b = g.querySelector("#gerr"); b.textContent = m; b.style.display = "block"; };
      em.focus();
      g.querySelector("#tg").onclick = () => { mode = mode === "login" ? "signup" : "login"; draw(); };
      const submit = async () => {
        const e = em.value.trim(), p = pw.value;
        if (!e.includes("@")) return showErr("Adj meg egy érvényes e-mail-címet.");
        if (p.length < 6) return showErr("A jelszó legalább 6 karakter legyen.");
        go.disabled = true;
        try { await signIn(e, p, mode === "signup"); g.remove(); res(); }
        catch (x) { go.disabled = false; showErr(authMsg(x)); }
      };
      go.onclick = submit;
      pw.onkeydown = e => { if (e.key === "Enter") submit(); };
    };
    document.body.appendChild(g);
    draw();
  });
}

async function init() {
  session = loadSession();
  if (!session || !session.uid) await authGate();
  try { await ensureToken(); }
  catch (e) { if (e.message === "REFRESH") { lsDel("millnotes.auth"); session = null; await authGate(); } }   // a fiók lejárt: új belépés kell, a helyi adatok megmaradnak
  hash = session.uid;
  loadLocal();
  render();
  connect();
  if (pending()) flush();
  setInterval(() => { purge(); if (S.view !== "search") renderListSoon(); }, 60000);
  try { if (window.AndroidBridge && AndroidBridge.takeShared) { const s = JSON.parse(AndroidBridge.takeShared() || "null"); if (s) appShareIn(s.subject, s.text); } } catch (e) {}
}
init();
</script>
