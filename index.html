:root{
  --bg:#0d0a12;
  --panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);
  --hover:rgba(255,255,255,.06);--sel:rgba(255,255,255,.1);
  --text:#f6f1ee;--muted:rgba(250,236,230,.6);--dim:rgba(250,236,230,.34);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --a1:#fbbf24;--a2:#fb7185;--acc:#fcd34d;
  --grad:linear-gradient(135deg,#fbbf24,#fb7185);--on-grad:#1a0a05;
  --glow:0 10px 30px -10px rgba(251,146,60,.55);
  --ok:#34d399;--bad:#f43f5e;--warn:#fbbf24;
  --r:16px;--ease:cubic-bezier(.2,.8,.2,1);
  --sans:'SG',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabh:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(60% 50% at 0% 0%,rgba(190,24,93,.26),transparent 70%),
    radial-gradient(55% 45% at 100% 100%,rgba(245,158,11,.2),transparent 70%),
    radial-gradient(40% 30% at 75% 5%,rgba(251,113,133,.1),transparent 70%),
    var(--bg);
  background-attachment:fixed;color:var(--text);font-family:var(--sans);font-size:15px;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
::selection{background:rgba(251,191,36,.32)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.fold{stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:11px/1 ui-monospace,Consolas,monospace;color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:3px 5px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.16)}

/* ===== Logó ===== */
.logo{display:block;flex:none;width:38px;height:48px;overflow:visible}
.logo .wh{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite;animation-play-state:paused}
.logo .w1{animation-delay:-.7s}.logo .w2{animation-delay:-1.4s}
.logo.spin .wh,.logo.run .wh{animation-play-state:running}
.logo.off{opacity:.55;filter:grayscale(.7)}
.logo.bad{filter:drop-shadow(0 0 6px rgba(244,63,94,.6))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ===== Elrendezés: két üveglap ===== */
.app{height:100%;display:grid;grid-template-columns:256px minmax(0,1fr);gap:12px;padding:12px;position:relative}
#navDyn{display:flex;flex-direction:column;flex:1;min-height:0}
nav{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;padding:14px 10px 10px;overflow:auto}
#main{position:relative;min-width:0;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#listPane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#docPane{display:flex;flex-direction:column;min-height:0;min-width:0}
#setPane{display:none;grid-column:1/-1;min-height:0;overflow:auto}
#main.setmode #listPane,#main.setmode #docPane{display:none}
#main.setmode #setPane{display:block}
#mtop{display:none}
.scrim{display:none}

/* ===== Oldalsáv ===== */
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 16px}
.brand b{display:block;font-size:19px;font-weight:700;letter-spacing:-.6px}
.brand small{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--a1);box-shadow:0 0 8px var(--a1)}
.sdot.w{background:var(--warn);box-shadow:none;opacity:.7}
.sdot.b{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sdot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:11px 12px;background:var(--grad);color:var(--on-grad);font-weight:700;font-size:14px;box-shadow:var(--glow);transition:filter .15s,transform .12s}
.newbtn:hover{filter:brightness(1.08)}
.newbtn:active{transform:scale(.98)}
.cmdbtn{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 14px;border:1px solid var(--line);border-radius:12px;background:rgba(5,3,10,.35);padding:9px 10px;color:var(--muted);font-size:13px;text-align:left;transition:border-color .15s,color .15s}
.cmdbtn:hover{border-color:var(--line2);color:var(--text)}
.cmdbtn kbd{margin-left:auto}
.nitem{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:12px;padding:9px 10px;background:transparent;font-size:14px;text-align:left;color:var(--muted);transition:background .15s,color .15s}
.nitem:hover{background:var(--hover);color:var(--text)}
.nitem.on{background:var(--panel2);color:var(--text)}
.nitem.on svg.i{color:var(--a1)}
.nitem .tl{flex:1;min-width:0}
.n{font-size:11px;font-weight:700;background:var(--grad);color:var(--on-grad);border-radius:8px;padding:1px 7px;min-width:22px;text-align:center}
.n:empty{display:none}
.nitem.tsearch{display:none}
.lbl{display:flex;align-items:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);padding:18px 10px 6px}
.lbl button{margin-left:auto;border:0;background:transparent;color:var(--muted);border-radius:8px;width:26px;height:26px;display:grid;place-items:center}
.lbl button:hover{background:var(--hover);color:var(--text)}
.tnode{display:flex;align-items:center;border-radius:12px;transition:background .15s}
.tnode:hover{background:var(--hover)}
.tnode.on{background:var(--panel2)}
.tnode.drop,.frow.drop,.nitem.drop{background:rgba(251,191,36,.1);box-shadow:inset 0 0 0 1px var(--a1)}
.car{width:22px;height:32px;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;flex:none;padding:0}
.car svg{width:14px;height:14px;transition:transform .2s var(--ease)}
.car.open svg{transform:rotate(90deg)}
.tlink{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:7px 8px 7px 0;font-size:14px;text-align:left;color:var(--muted)}
.tnode.on .tlink,.tnode:hover .tlink{color:var(--text)}
.tlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{padding:2px 8px}
.tagbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);margin:0 6px 6px 0;transition:border-color .15s,color .15s,background .15s}
.tagbtn span{color:var(--dim)}
.tagbtn:hover,.tagbtn.on{border-color:rgba(251,191,36,.55);color:var(--text);background:rgba(251,191,36,.08)}
.navfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}

/* ===== Lista ===== */
.lhead{padding:12px 16px 12px;border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:6px}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--a1)}
.hamb,.back{display:none}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:18px}
.crumbs button{border:0;background:transparent;padding:2px 5px;border-radius:7px;color:var(--muted);font-size:13px}
.crumbs button:hover{color:var(--text);background:var(--hover)}
.ltitle{flex:1;min-width:0;font-size:24px;font-weight:700;letter-spacing:-.8px;margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcount{font-size:12px;color:var(--muted);margin-top:2px}
.searchbox{position:relative;margin-top:12px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search,.field{background:rgba(5,3,10,.55);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s;width:100%}
.search{padding-left:38px}
.search:focus,.field:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(251,191,36,.18)}
input[type=checkbox]{accent-color:var(--a1)}
.list{flex:1;min-height:0;overflow:auto;padding:10px 10px 90px}
.frow{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;color:var(--text);transition:background .15s}
.frow:hover{background:var(--hover)}
.frow .n{margin-left:auto;background:var(--hover);color:var(--muted);font-weight:500}
.frow .chev{color:var(--dim);display:flex}
.frow .chev svg{width:16px;height:16px}
.card{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;margin-bottom:8px;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.card:hover{background:var(--panel2);border-color:var(--line2)}
.card.on{background:var(--sel);border-color:rgba(251,191,36,.5)}
.card.new{animation:rise .4s ease both}
.ct{display:flex;align-items:center;gap:8px;min-width:0}
.ctitle{font-weight:600;font-size:15px;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ctitle.empty{color:var(--dim);font-weight:500}
.ct svg.i{width:15px;height:15px;color:var(--a1)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.cs{font-size:13px;line-height:1.5;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cm{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--dim);margin-top:9px}
.chip{border-radius:999px;background:rgba(251,191,36,.12);color:var(--acc);padding:2px 8px;font-size:11px}
mark{background:rgba(251,191,36,.3);color:inherit;border-radius:3px;padding:0 1px}
.sect{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);padding:14px 12px 8px}
.empty{padding:44px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty .logo{width:64px;height:81px;margin:0 auto 14px;opacity:.35}
.fab{display:none}
.trashrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.trashrow .tn{flex:1 1 150px;min-width:0}
.trashrow .tn b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trashrow .tn small{font-size:12px;color:var(--muted)}
.mini{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--text);transition:border-color .15s,background .15s}
.mini:hover{border-color:rgba(251,191,36,.55);background:var(--panel2)}
.mini.bad{color:var(--bad)}
.mini.bad:hover{border-color:rgba(244,63,94,.55)}

/* ===== Szerkesztő ===== */
.dhead{display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);height:52px;flex:none}
.dpath{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.dscroll{flex:1;min-height:0;overflow:auto}
.col{max-width:760px;margin:0 auto;padding:30px 36px 120px}
.dtitle{width:100%;background:transparent;border:0;outline:none;font-size:36px;font-weight:700;letter-spacing:-.8px;line-height:1.15;padding:0;color:var(--text)}
.dtitle::placeholder{color:rgba(255,255,255,.16)}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:12px 0 18px}
.tbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:2px;padding:5px;margin:0 -6px 10px;background:rgba(20,14,22,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}
.tbar .ib{width:34px;height:34px;font-weight:700;font-size:14px}
.tsep{width:1px;height:20px;background:var(--line);margin:0 4px}
.seg{display:flex;gap:3px;background:rgba(5,3,10,.55);border:1px solid var(--line2);border-radius:12px;padding:3px}
.tbar .seg{margin-left:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:13px;color:var(--muted);white-space:nowrap;transition:color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--grad);color:var(--on-grad);font-weight:700}
textarea.doc{display:block;width:100%;min-height:55vh;resize:none;overflow:hidden;background:transparent;border:0;outline:none;font-size:17px;line-height:1.75;padding:6px 0;color:#ece4df;caret-color:var(--a1)}
textarea.doc::placeholder{color:var(--dim)}
.prev{font-size:17px;line-height:1.75;color:#ece4df;padding:6px 0;word-wrap:break-word;min-height:40vh}
.prev h1,.prev h2,.prev h3{color:var(--text);font-weight:700;letter-spacing:-.5px;line-height:1.3;margin:20px 0 6px}
.prev h1{font-size:27px}.prev h2{font-size:22px}.prev h3{font-size:18px}
.prev p{margin:0}
.prev .sp{height:14px}
.prev ul,.prev ol{margin:4px 0;padding-left:24px}
.prev li::marker{color:var(--a1)}
.prev ul.chk{list-style:none;padding-left:2px}
.prev li.task{display:flex;align-items:flex-start;gap:10px}
.prev li.task.done span{color:var(--dim);text-decoration:line-through}
.cb{width:20px;height:20px;margin-top:5px;flex:none;border-radius:6px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.cb[aria-pressed="true"]{background:var(--grad);border-color:transparent}
.cb svg{width:13px;height:13px;stroke:var(--on-grad);fill:none;stroke-width:3}
.prev code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--panel2);border-radius:6px;padding:2px 6px}
.prev blockquote{margin:6px 0;padding:2px 0 2px 14px;border-left:3px solid var(--a2);color:var(--muted)}
.prev hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.prev a{color:var(--acc)}
.prev b{color:var(--text)}
.prev .tag,.tagtxt{color:var(--acc);cursor:pointer}
.dfoot{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:9px 18px;flex:none}
.dfoot b{color:var(--text);font-weight:600}
.dfoot .st{margin-left:auto;display:flex;align-items:center;gap:7px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pulse.w{background:var(--warn);box-shadow:none}
.pulse.b{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.trashbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:12px 14px;border-radius:14px;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.28);font-size:13px;color:var(--muted)}
.trashbar span{flex:1}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--muted)}
.welcome .logo{width:92px;height:123px;margin-bottom:22px;opacity:.9}
.welcome h2{color:var(--text);font-size:24px;font-weight:700;letter-spacing:-.6px;margin:0 0 8px}
.welcome p{margin:0 0 22px;font-size:14px}
.keys{display:grid;grid-template-columns:auto auto;gap:9px 14px;font-size:13px;text-align:left}

/* ===== Fókusz mód ===== */
.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus nav{display:none}
.app.focus #main{grid-template-columns:minmax(0,1fr)}
.app.focus #listPane{display:none}
.app.focus .col{max-width:720px;padding-top:56px}

/* ===== Beállítások ===== */
.shead{display:flex;align-items:center;gap:6px;height:52px;padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4;background:rgba(17,12,19,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.shead h1{font-size:15px;font-weight:600;margin:0;color:var(--muted)}
.swrap{max-width:980px;margin:0 auto;padding:26px 26px 40px}
.swrap>h2{font-size:30px;font-weight:700;letter-spacing:-.8px;margin:0 0 4px}
.swrap>p{margin:0 0 22px;color:var(--muted);font-size:14px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sgrp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;animation:rise .4s ease both}
.sgrp h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.sico{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:var(--on-grad);flex:none}
.sico svg.i{width:16px;height:16px;stroke-width:2.2}
.sgrp>p{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.sf{margin:16px 0 0}
.sf>label,.sf>.sl{display:block;font-size:13px;font-weight:500}
.sf>small{display:block;font-size:12px;color:var(--muted);margin:2px 0 8px}
.sf .seg{display:inline-flex}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-size:18px;line-height:1;transition:border-color .15s}
.stepper button:hover:not(:disabled){border-color:rgba(251,191,36,.55)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper input{width:64px;text-align:center;font-weight:700;font-size:16px;padding:8px 6px}
.stepper span{color:var(--muted);font-size:13px}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(5,3,10,.4);border:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.acct b{display:block;font-size:15px}
.acct small{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-top:2px}
.acct .mini{margin-left:auto}
.sstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sstat div{background:rgba(5,3,10,.4);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sstat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.5px}
.sstat span{font-size:12px;color:var(--muted)}
#setBar{position:sticky;bottom:12px;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px 16px;margin:18px 0 0;background:rgba(26,16,24,.94);border:1px solid var(--line2);border-radius:16px;box-shadow:0 -10px 30px -12px #000;transform:translateY(130%);opacity:0;transition:transform .3s var(--ease),opacity .3s;pointer-events:none}
#setBar.show{transform:none;opacity:1;pointer-events:auto}
#setBar span{flex:1;font-size:13px;color:var(--muted)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover);border-color:transparent}

/* ===== Lebegő elemek ===== */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);display:flex;align-items:center;gap:14px;background:#1b1219;border:1px solid var(--line2);padding:10px 10px 10px 16px;border-radius:14px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 30px -12px rgba(251,146,60,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:90;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--grad);color:var(--on-grad);font-weight:700;padding:6px 12px;border-radius:10px}
.ov{position:fixed;inset:0;background:rgba(6,3,8,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.ov.show{display:flex}
.dlg{width:min(460px,100%);max-height:calc(100% - 16px);overflow:auto;background:linear-gradient(160deg,#21141f,#100a12);border:1px solid var(--line2);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .22s var(--ease)}
.dlg.wide{width:min(820px,100%)}
.dlg h3{margin:0 0 12px;font-size:22px;font-weight:700;letter-spacing:-.5px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.55}
.dlg h4{margin:18px 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}
textarea.field{min-height:200px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.plist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:rgba(5,3,10,.45)}
.pick{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px;font-size:14px;text-align:left}
.pick:hover{background:var(--hover)}
.pick.on{background:var(--sel);border-color:rgba(251,191,36,.5)}
.row2{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:9px 16px;font-size:14px;transition:filter .15s,border-color .15s,background .15s,transform .12s}
.btn:hover:not(:disabled){border-color:rgba(251,191,36,.55);background:var(--panel2)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:var(--on-grad);font-weight:700;box-shadow:var(--glow)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--grad);border-color:transparent}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.btn.bad:hover:not(:disabled){filter:brightness(1.08);background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.warnbox{font-size:13px;color:var(--acc);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);border-radius:12px;padding:9px 11px;margin:4px 0 8px}
.hist{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;min-height:320px}
.hlist{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:52vh;padding:6px;background:rgba(5,3,10,.45)}
.hitem{display:block;width:100%;border:1px solid transparent;background:transparent;text-align:left;border-radius:10px;padding:9px 10px;font-size:13px}
.hitem:hover{background:var(--hover)}
.hitem.on{background:var(--sel);border-color:rgba(251,191,36,.5)}
.hitem small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.hprev{border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:52vh;white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--muted);background:rgba(5,3,10,.45)}
.menu{position:fixed;z-index:80;min-width:210px;background:linear-gradient(160deg,#21141f,#140d16);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55);animation:pop .16s var(--ease)}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-size:14px;text-align:left}
.mi:hover,.mi:focus-visible{background:var(--hover)}
.mi.danger{color:var(--bad)}
.mi .ck{margin-left:auto;color:var(--a1)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.swatch{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line2)}
.pal{position:fixed;inset:0;z-index:75;background:rgba(6,3,8,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal.show{display:flex}
.palbox{width:min(600px,100%);background:linear-gradient(160deg,#21141f,#100a12);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:pop .18s var(--ease)}
.palin{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;padding:17px 18px;font-size:16px}
.palres{max-height:52vh;overflow:auto;padding:6px}
.pi{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px}
.pi.on{background:var(--sel);border-color:rgba(251,191,36,.45)}
.pi svg.i{color:var(--a1)}
.pi small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:95;padding:20px;background:inherit}
.gate .dlg{width:min(400px,100%)}
.gate .logo{width:64px;height:86px;margin:0 0 16px}
.gate .field+.field{margin-top:8px}

/* ===== Közepes szélesség: az oldalsáv behúzható ===== */
@media (max-width:1099px){
  .app{grid-template-columns:minmax(0,1fr)}
  #main{grid-template-columns:320px minmax(0,1fr)}
  nav{position:fixed;top:12px;bottom:12px;left:12px;z-index:60;width:280px;background:linear-gradient(160deg,#1c1119,#100a12);transform:translateX(-110%);transition:transform .28s var(--ease);box-shadow:16px 0 50px rgba(0,0,0,.5)}
  nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .hamb{display:grid}

const live = i => i && !i.trashedAt;
const nameOf = i => (i && i.name) || (i && i.type === "folder" ? "Névtelen mappa" : "Névtelen jegyzet");
const parentOk = i => i.parentId && items[i.parentId] && items[i.parentId].type === "folder";
const pid = i => (parentOk(i) ? i.parentId : null);   // árva elem a gyökérbe kerül
const docs = () => Object.values(items).filter(i => i.type === "doc" && live(i));
const kids = p => Object.values(items).filter(i => pid(i) === p && live(i));
const folders = p => kids(p).filter(i => i.type === "folder").sort((a, b) => nameOf(a).localeCompare(nameOf(b), "hu"));
const topTrashed = () => Object.values(items).filter(i => i.trashedAt && !(parentOk(i) && items[i.parentId].trashedAt));
const inside = (id, anc) => { let p = items[id]?.parentId, n = 0; while (p && n++ < 200) { if (p === anc) return true; p = items[p]?.parentId; } return false; };
const crumbs = id => { const o = []; let c = id, n = 0; while (c && items[c] && n++ < 200) { o.unshift(items[c]); c = parentOk(items[c]) ? items[c].parentId : null; } return o; };
const pathOf = i => crumbs(pid(i)).map(nameOf).join(" › ") || "Jegyzetek";
const words = s => (s || "").trim().split(/\s+/).filter(Boolean).length;
const colorOf = id => COLORS.find(c => c.id === id) || COLORS[0];
const HU_M = ["jan.", "febr.", "márc.", "ápr.", "máj.", "jún.", "júl.", "aug.", "szept.", "okt.", "nov.", "dec."];
const p2 = n => String(n).padStart(2, "0");
const fmt = t => { const d = new Date(t); return `${d.getFullYear()}. ${HU_M[d.getMonth()]} ${d.getDate()}. ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
function rel(t) {
  if (!t) return "";
  const s = (Date.now() - t) / 1000, d = new Date(t), now = new Date();
  if (s < 45) return "épp most";
  if (s < 3600) return `${Math.round(s / 60)} perce`;
  if (d.toDateString() === now.toDateString()) return `ma ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `tegnap ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)} napja`;
  return `${d.getFullYear() !== now.getFullYear() ? d.getFullYear() + ". " : ""}${HU_M[d.getMonth()]} ${d.getDate()}.`;
}
// ékezet- és kisbetűfüggetlen összevetés, az eredeti szövegbeli pozíciókkal
function fold(str) {
  let s = "", map = [];
  for (let i = 0; i < str.length; i++) {
    const n = str[i].normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    for (const ch of n) { s += ch; map.push(i); }
  }
  map.push(str.length);
  return { s, map };
}
const plainFold = s => fold(s || "").s;
function hit(text, q) {
  if (!q) return null;
  const f = fold(text || ""), at = f.s.indexOf(plainFold(q));
  if (at < 0) return null;
  return { a: f.map[at], b: f.map[at + plainFold(q).length] };
}
function markText(text, q) {
  const h = hit(text, q);
  if (!h) return esc(text);
  return esc(text.slice(0, h.a)) + "<mark>" + esc(text.slice(h.a, h.b)) + "</mark>" + esc(text.slice(h.b));
}
const stripMd = s => (s || "").replace(/^\s*[-*] \[[ xX]\] /gm, "☐ ").replace(/^#{1,3} /gm, "").replace(/^\s*[-*] /gm, "• ").replace(/\*\*|`/g, "").replace(/\s+/g, " ").trim();
function snippet(d, q) {
  const c = stripMd(d.content);
  if (!c) return "";
  const h = q ? hit(c, q) : null;
  if (!h) return esc(c.slice(0, 160));
  const st = Math.max(0, h.a - 50), part = c.slice(st, st + 170);
  return (st ? "…" : "") + markText(part, q);
}
const TAG_RE = /(^|[\s(,;])#([\p{L}\d][\p{L}\d_-]*)/gu;
function tagsOf(d) { const o = new Set(); for (const m of (d.content || "").matchAll(TAG_RE)) o.add(m[2].toLowerCase()); return [...o]; }
function allTags() { const m = new Map(); for (const d of docs()) for (const t of tagsOf(d)) m.set(t, (m.get(t) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "hu")); }
function norm(r) {
  if (!r || typeof r !== "object" || !r.id || (r.type !== "doc" && r.type !== "folder")) return null;
  return { id: String(r.id), type: r.type, parentId: r.parentId || null, name: String(r.name ?? ""), content: String(r.content ?? ""),
    modified: +r.modified || 0, created: +r.created || +r.modified || Date.now(), trashedAt: r.trashedAt || null,
    pinned: !!r.pinned, color: r.color || "", snapAt: +r.snapAt || 0, base: +r.base || 0 };
}

/* ===== Fiókszintű beállítások (szinkronizálva) ===== */
const CONF = { trashDays: 30 };
const confKey = () => "millnotes.conf." + hash;
const purgeMs = () => (CONF.trashDays || 30) * 864e5;
function loadConf() { try { const j = JSON.parse(lsGet(confKey()) || "{}"); if (+j.trashDays) CONF.trashDays = Math.min(90, Math.max(7, +j.trashDays)); } catch (e) {} }
async function fetchConf() {

    const r = await fetch(url("settings")); if (!r.ok) return;

    if (j && +j.trashDays && hq.settings === undefined && +j.trashDays !== CONF.trashDays) {

/* ===== Helyi tárolás: offline is minden megmarad ===== */
let saveT = null;
const stateKey = () => "millnotes.state." + hash;
function saveLocal() {
  clearTimeout(saveT); saveT = null;
  if (!hash || loggingOut) return;
  const ok = lsSet(stateKey(), JSON.stringify({ v: 2, items, dirty: [...dirty], hq, known }));
  if (!ok) toast("A helyi tárhely megtelt, a mentés csak online működik");
}
function saveSoon() { if (!saveT) saveT = setTimeout(saveLocal, 300); }
function loadLocal() {

    const j = JSON.parse(lsGet(stateKey()) || "null");

    hq = j.hq || {}; known = j.known || {};

}

/* ===== Szinkron (Firebase REST + EventSource) ===== */
const AUTH_URL = "https://identitytoolkit.googleapis.com/v1/accounts:";
const base = () => CFG.databaseURL.replace(/\/$/, "") + "/users/" + hash + "/";
const url = (p, extra = "") => base() + p + ".json?" + (extra ? extra + "&" : "") + "auth=" + encodeURIComponent(session.idToken);
const pending = () => dirty.size + Object.keys(hq).length;

let reT = null;
async function connect() {
  if (!CFG.databaseURL) { conn = "nourl"; syncUI(); return; }
  if (es) es.close();
  clearTimeout(reT);
  try { await ensureToken(); }
  catch (e) { if (e.message === "REFRESH") { conn = "denied"; syncUI(); return; } }
  reT = setTimeout(connect, Math.max(30000, session.expiresAt - Date.now() - 120000));   // a token lejárta előtt újracsatlakozunk
  conn = "connecting"; syncUI();
  es = new EventSource(url("items"));
  es.addEventListener("put", e => onRemote("put", JSON.parse(e.data)));
  es.addEventListener("patch", e => onRemote("patch", JSON.parse(e.data)));
  es.addEventListener("keep-alive", () => { if (conn !== "open") { conn = "open"; syncUI(); } });
  const deny = () => { conn = "denied"; syncUI(); es.close(); };
  es.addEventListener("cancel", deny);
  es.addEventListener("auth_revoked", deny);
  es.onopen = () => { conn = "open"; syncUI(); flush(); fetchConf(); };
  es.onerror = () => { if (conn !== "denied") { conn = "error"; syncUI(); } };
}

function queue(id) {
  dirty.add(id);
  clearTimeout(flushT); flushT = setTimeout(flush, 400);
  saveSoon(); syncUI();
}
function queuePath(p, body) { hq[p] = body; clearTimeout(flushT); flushT = setTimeout(flush, 400); saveSoon(); syncUI(); }

async function req(p, method, body) {
  await ensureToken();
  const r = await fetch(url(p), { method, headers: { "Content-Type": "application/json" }, body });
  if (r.status === 401 || r.status === 403) { conn = "denied"; syncUI(); throw new Error("denied"); }
  if (!r.ok) throw new Error(r.status);
  return r;
}

async function flush() {
  if (!hash || !CFG.databaseURL) return;
  if (flushing) { flushAgain = true; return; }
  clearTimeout(flushT);
  flushing = true; syncUI();
  try {
    while (pending()) {
      if (dirty.size) {
        const id = dirty.values().next().value, it = items[id];
        dirty.delete(id);
        if (it) sentMod.set(id, it.modified);
        try { await req("items/" + id, it ? "PUT" : "DELETE", it ? JSON.stringify(it) : undefined); if (it) known[id] = it.modified; }
        catch (e) { dirty.add(id); throw e; }
        continue;
      }
      const p = Object.keys(hq)[0], b = hq[p];
      await req(p, b === null ? "DELETE" : "PUT", b === null ? undefined : JSON.stringify(b));
      if (hq[p] === b) delete hq[p];
      if (b && p.startsWith("hist/")) prune(p.split("/")[1]);
    }
    failN = 0;
  } catch (e) {
    failN++;
    clearTimeout(retryT);
    retryT = setTimeout(flush, Math.min(60000, 3000 * 2 ** Math.min(failN, 5)));
  } finally {
    flushing = false; saveSoon(); syncUI();
    if (document.querySelector("#dfst")) footUI();
    if (flushAgain) { flushAgain = false; flush(); }
  }
}

async function prune(docId) {
  try {
    const r = await fetch(url("hist/" + docId, "shallow=true"));
    const keys = Object.keys((await r.json()) || {}).sort((a, b) => b - a);
    for (const k of keys.slice(HIST_KEEP)) fetch(url(`hist/${docId}/${k}`), { method: "DELETE" });
  } catch (e) {}
}

function snapshot(it, content, why) {
  if (!it || it.type !== "doc" || !content) return;
  let t = Date.now();
  while (hq[`hist/${it.id}/${t}`] !== undefined) t++;
  queuePath(`hist/${it.id}/${t}`, { t, name: it.name, content, why });
}

function merge(id, raw) {
  if (raw === null) { if (!dirty.has(id)) { delete items[id]; delete known[id]; } return; }
  const r = norm(raw); if (!r) return;
  const l = items[id], k = known[id] || 0;
  if (r.modified >= k) known[id] = r.modified;
  if (l && dirty.has(id)) {
    if (sentMod.get(id) === r.modified) return;        // a saját, korábban elküldött változatunk visszhangja
    const localWins = (l.modified || 0) >= (r.modified || 0);
    if (l.type === "doc" && l.content !== r.content)    // ütközés: a vesztes változat az előzményekbe kerül
      snapshot(l, localWins ? r.content : l.content, localWins ? "Másik eszköz ütköző változata" : "Helyi változat ütközés előtt");
    if (localWins) return;
    dirty.delete(id);
  } else if (l && l.type === "doc" && k && r.modified > k && r.base < k && l.content !== r.content) {
    // a másik eszköz úgy írt, hogy nem látta a mi változatunkat: a felülírt szöveg az előzményekbe kerül
    snapshot(l, l.content, "Felülírt változat (ütközés)");
  }
  items[id] = r;
}

function onRemote(type, { path, data }) {
  lastRemote = Date.now();
  const parts = path.split("/").filter(Boolean);
  if (type === "put" && !parts.length) {
    if (!data) {
      // üres a szerver (új vagy törölt adatbázis): a helyi jegyzeteket visszatöltjük, nem töröljük
      const ids = Object.keys(items);
      if (ids.length) ids.forEach(queue); else seed();
    } else {
      for (const id of Object.keys(items)) if (!(id in data) && !dirty.has(id)) delete items[id];
      for (const id in data) merge(id, data[id]);
    }
    purge();
  } else if (type === "put" && parts.length === 1) {
    merge(parts[0], data);
  } else if (type === "put") {
    const cur = items[parts[0]] ? { ...items[parts[0]] } : null;
    if (cur && !dirty.has(parts[0])) { cur[parts[1]] = data; merge(parts[0], cur); }
  } else {
    const pre = parts.length ? parts[0] : null;
    for (const k in (data || {})) {
      if (pre) { const cur = items[pre] ? { ...items[pre] } : null; if (cur && !dirty.has(pre)) { cur[k] = data[k]; merge(pre, cur); } }
      else merge(k, data[k]);
    }
  }
  if (conn !== "open") conn = "open";
  saveSoon(); syncUI(); render();
}

function seed() {
  const flag = "millnotes.seeded." + hash;
  if (lsGet(flag) === "1") return;
  lsSet(flag, "1");
  const now = Date.now();
  const f = { id: uid(), type: "folder", parentId: null, name: "Első lépések", content: "", modified: now, created: now, trashedAt: null, pinned: false, color: "", snapAt: 0 };
  const d = { id: uid(), type: "doc", parentId: null, name: "Üdv a MillNotes-ban", modified: now, created: now, trashedAt: null, pinned: true, color: "yellow", snapAt: 0,
    content: "Ez az első jegyzeted. Írj bármit, és a változás a másik eszközödön is megjelenik.\n\n## Amit tud\n- [x] Mappák, címkék és kitűzés\n- [ ] Próbáld ki a **Ctrl+K** parancspalettát\n- [ ] Válts *Olvasó* nézetre, és pipáld ki ezt a sort\n- Offline is működik, a malom kerekei forognak, amíg ment\n\nA #teendők címke automatikusan megjelenik a bal oldalon, a *Tippek* jegyzetet az Első lépések mappában találod." };
  const t = { id: uid(), type: "doc", parentId: f.id, name: "Tippek", modified: now - 1000, created: now - 1000, trashedAt: null, pinned: false, color: "green", snapAt: now, base: 0,
    content: "## Gyorsbillentyűk\n- **Ctrl+K**: keresés és parancsok\n- **Ctrl+E**: olvasó és szerkesztő nézet\n- **Ctrl+B / Ctrl+I**: félkövér, dőlt\n\n## Rendszerezés\n- Húzd a jegyzetet egy mappára az áthelyezéshez\n- A törölt elemek a beállított ideig (alapból 30 napig) a lomtárban maradnak\n- Minden jegyzetnek van előzménye a ⋯ menüben\n\n#ötletek" };
  items[f.id] = f; items[d.id] = d; items[t.id] = t; queue(f.id); queue(d.id); queue(t.id);
}

/* ===== Módosítások ===== */
function save(id) {
  const it = items[id]; if (!it) return;
  if (!dirty.has(id)) it.base = known[id] || 0;      // melyik szerverváltozatra épül ez a módosítás
  it.modified = Date.now(); queue(id);
}
function uniqFolder(p, name, exceptId) {
  const taken = new Set(kids(p).filter(i => i.type === "folder" && i.id !== exceptId).map(nameOf));
  if (!taken.has(name)) return name;
  let n = 2; while (taken.has(`${name} (${n})`)) n++;
  return `${name} (${n})`;
}
function create(type, name, p, content = "") {
  const id = uid(), now = Date.now();
  items[id] = { id, type, parentId: p || null, name: type === "folder" ? uniqFolder(p || null, name, null) : name, content, modified: now, created: now, trashedAt: null, pinned: false, color: "", snapAt: now, base: 0 };
  if (p) S.open.add(p);
  queue(id);
  return id;
}
function walk(id, fn, n = 0) { if (n > 200) return; fn(id); for (const c of Object.values(items)) if (c.parentId === id) walk(c.id, fn, n + 1); }
function trash(id) {
  const ts = Date.now();
  walk(id, x => { if (!items[x].trashedAt) { items[x].trashedAt = ts; items[x].modified = ts; queue(x); } });
  return ts;
}
function restore(id) {
  const root = items[id]; if (!root) return;
  const ts = root.trashedAt, now = Date.now();
  walk(id, x => { if (items[x].trashedAt === ts) { items[x].trashedAt = null; items[x].modified = now; queue(x); } });
  if (root.parentId && (!items[root.parentId] || items[root.parentId].trashedAt)) { root.parentId = null; save(root.id); }
}
function hardDelete(id) { walk(id, x => { if (items[x]?.type === "doc") queuePath("hist/" + x, null); delete items[x]; queue(x); }); }
function move(id, target) {
  if (!items[id] || id === target || (target && inside(target, id))) return false;
  if ((items[id].parentId || null) === (target || null)) return true;
  items[id].parentId = target || null;
  if (items[id].type === "folder") items[id].name = uniqFolder(target || null, nameOf(items[id]), id);
  save(id);
  return true;
}
function purge() {
  const cut = Date.now() - purgeMs();
  for (const it of Object.values(items)) if (it.trashedAt && it.trashedAt < cut && items[it.id]) hardDelete(it.id);
}
function importText(txt, dest) {
  const blocks = txt.split(/^\s*---\s*$/m).map(b => b.trim()).filter(Boolean);
  for (const b of blocks) {
    const lines = b.split("\n");
    const title = lines.shift().trim().slice(0, 120) || "Importált jegyzet";
    create("doc", title, dest, lines.join("\n").trim());
  }
  return blocks.length;
}

/* ===== Fájlok, megosztás ===== */
function download(name, data, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const today = () => new Date().toISOString().slice(0, 10);
function exportJson() {
  const data = JSON.stringify({ app: "jegyzetek", version: 2, exportedAt: new Date().toISOString(), items: Object.values(items) }, null, 2);
  const name = `millnotes-${today()}.json`;
  if (window.AndroidBridge && AndroidBridge.saveFile) AndroidBridge.saveFile(name, data);
  else { download(name, data, "application/json"); toast("Export elkészült"); }
}
const fileSafe = s => (s || "jegyzet").replace(/[\\/:*?"<>|]+/g, "-").slice(0, 80);
function exportMd(d) {
  const data = `# ${nameOf(d)}\n\n${d.content || ""}\n`, name = fileSafe(nameOf(d)) + ".md";
  if (window.AndroidBridge && AndroidBridge.saveText) AndroidBridge.saveText(name, data);
  else { download(name, data, "text/markdown"); toast("Markdown-fájl elkészült"); }
}
async function shareDoc(d) {
  const text = `${nameOf(d)}\n\n${d.content || ""}`;
  if (window.AndroidBridge && AndroidBridge.shareText) { AndroidBridge.shareText(nameOf(d), text); return; }
  if (navigator.share) { try { await navigator.share({ title: nameOf(d), text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("A jegyzet a vágólapra került"); } catch (e) { toast("A megosztás itt nem érhető el"); }
}
function openUrl(u) {
  if (window.AndroidBridge && AndroidBridge.openUrl) AndroidBridge.openUrl(u);
  else window.open(u, "_blank", "noopener");
}
function importJson() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const arr = Array.isArray(j) ? j : (j.items ? Object.values(j.items) : []);
      let n = 0;
      for (const raw of arr) {
        const r = norm(raw); if (!r) continue;
        const l = items[r.id];
        if (!l || r.modified > (l.modified || 0)) { items[r.id] = r; queue(r.id); n++; }
      }
      render(); toast(`${n} elem importálva`);
    } catch (e) { toast("Hibás JSON-fájl"); }
  };
  inp.click();
}

/* ===== Párbeszédablakok, menük, értesítések ===== */
let closeModal = null;
function modal({ title, body = "", ok = "OK", bad = false, read = null, onOpen = null, cancel = "Mégse", noOk = false, wide = false }) {
  if (closeModal) closeModal(null);
  return new Promise(resolve => {
    const ov = $("#ov");
    ov.innerHTML = `<div class="dlg ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}<div class="row2"><button class="btn" data-x>${esc(cancel)}</button>${noOk ? "" : `<button class="btn ${bad ? "bad" : "pri"}" data-ok>${esc(ok)}</button>`}</div></div>`;
    ov.classList.add("show");
    const prevFocus = document.activeElement;
    const close = r => {
      if (closeModal !== close) return;
      closeModal = null; ov.classList.remove("show"); ov.innerHTML = ""; resolve(r);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus();
    };
    closeModal = close;
    ov.onclick = e => { if (e.target === ov) close(null); };
    ov.querySelector("[data-x]").onclick = () => close(null);
    const okb = ov.querySelector("[data-ok]");
    if (okb) okb.onclick = () => { const r = read ? read(ov) : { v: true }; if (r) close(r); };
    if (onOpen) onOpen(ov, close); else (okb || ov.querySelector("[data-x]")).focus();
  });
}
const confirmBox = (title, text, ok, bad = false) => modal({ title, body: `<p>${esc(text)}</p>`, ok, bad });
async function askText(title, val = "", ok = "Mentés") {
  const r = await modal({
    title, ok,
    body: `<input class="field" id="mv" value="${esc(val)}" maxlength="120" aria-label="${esc(title)}">`,
    onOpen: ov => { const i = ov.querySelector("#mv"); i.focus(); i.select(); i.onkeydown = e => { if (e.key === "Enter") ov.querySelector("[data-ok]").click(); }; },
    read: ov => { const v = ov.querySelector("#mv").value.trim(); return v ? { v } : null; }
  });
  return r ? r.v : null;
}
async function pickFolder(exclude) {
  let sel = null;
  const tree = (p, d) => folders(p).filter(f => f.id !== exclude)

let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; document.removeEventListener("pointerdown", menuOutside, true); } }
function menuOutside(e) { if (openMenu && !openMenu.contains(e.target)) closeMenu(); }
function menu(anchor, entries) {
  const was = openMenu && openMenu._anchor === anchor;
  closeMenu(); if (was) return;
  const m = document.createElement("div");
  m.className = "menu"; m.setAttribute("role", "menu"); m._anchor = anchor;
  m.innerHTML = entries.map((e, i) => e === "-" ? '<div class="msep"></div>' :
    `<button role="menuitem" class="mi ${e.danger ? "danger" : ""}" data-mi="${i}">${e.icon || ""}<span>${esc(e.label)}</span>${e.checked ? '<span class="ck">✓</span>' : ""}</button>`).join("");
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  m.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  m.onclick = ev => { const b = ev.target.closest("[data-mi]"); if (!b) return; closeMenu(); entries[+b.dataset.mi].act(); };
  m.onkeydown = ev => {
    const bs = [...m.querySelectorAll(".mi")], i = bs.indexOf(document.activeElement);
    if (ev.key === "ArrowDown") { ev.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (ev.key === "ArrowUp") { ev.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  };
  openMenu = m;
  setTimeout(() => document.addEventListener("pointerdown", menuOutside, true));
  m.querySelector(".mi")?.focus();
}

/* ===== Egyszerű Markdown-megjelenítés ===== */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" data-url="$1">$1</a>')
    .replace(TAG_RE, (m, a, t) => `${a}<span class="tag" data-tag="${t.toLowerCase()}">#${t}</span>`);
}
function md(src) {
  let out = "", list = null;
  const open = k => { if (list !== k) { close(); out += k === "chk" ? '<ul class="chk">' : `<${k}>`; list = k; } };
  const close = () => { if (list) { out += list === "chk" ? "</ul>" : `</${list}>`; list = null; } };
  (src || "").split("\n").forEach((ln, i) => {
    let m;
    if ((m = ln.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/))) {
      open("chk"); const on = m[1] !== " ";
      out += `<li class="task ${on ? "done" : ""}"><button class="cb" data-check="${i}" aria-pressed="${on}" aria-label="${on ? "Kész" : "Nincs kész"}">${on ? CHECK : ""}</button><span>${inline(m[2])}</span></li>`;
      return;
    }
    if ((m = ln.match(/^\s*[-*] (.*)$/))) { open("ul"); out += `<li>${inline(m[1])}</li>`; return; }
    if ((m = ln.match(/^\s*\d+[.)] (.*)$/))) { open("ol"); out += `<li>${inline(m[1])}</li>`; return; }
    close();
    if ((m = ln.match(/^(#{1,3}) (.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; return; }
    if (/^\s*---+\s*$/.test(ln)) { out += "<hr>"; return; }
    if ((m = ln.match(/^> ?(.*)$/))) { out += `<blockquote>${inline(m[1])}</blockquote>`; return; }
    out += ln.trim() ? `<p>${inline(ln)}</p>` : '<div class="sp"></div>';
  });
  close();
  return out || '<p style="color:var(--dim)">Üres jegyzet. Válts szerkesztésre a kezdéshez.</p>';
}

function fmtAct(f) {
  const ta = $("#dc"); if (!ta) return;

  const all = lines.every(l => l.startsWith(pre));

    const bare = l.replace(/^(#{1,3} |[-*] \[[ xX]\] |[-*] )/, "");

}

async function history(d) {
  const local = Object.entries(hq).filter(([p, b]) => b && p.startsWith(`hist/${d.id}/`)).map(([, b]) => ({ ...b, local: true }));
  let remote = [], offline = false;
  try { const r = await fetch(url("hist/" + d.id)); if (!r.ok) throw 0; remote = Object.values((await r.json()) || {}); }
  catch (e) { offline = true; }
  const list = [...local, ...remote].filter(h => h && h.content != null).sort((a, b) => b.t - a.t);
  let sel = null;
  const r = await modal({
    title: `Előzmények · ${nameOf(d)}`, ok: "Visszaállítás", wide: true,
    body: (offline ? `<div class="warnbox">Offline vagy, csak az ezen az eszközön készült előzmények látszanak.</div>` : "") +
      (list.length ? `<div class="hist"><div class="hlist">${list.map((h, i) => `<button class="hitem" data-h="${i}">${esc(fmt(h.t))}<small>${esc(h.why || "")}${h.local ? " · még nincs feltöltve" : ""}</small></button>`).join("")}</div><div class="hprev" id="hprev">Válassz egy változatot a bal oldalon.</div></div>`
        : `<p>Ehhez a jegyzethez még nincs előzmény. Szerkesztés közben legfeljebb 10 percenként és minden ütközéskor készül egy, jegyzetenként az utolsó ${HIST_KEEP} marad meg.</p>`),
    read: () => sel,
    onOpen: ov => {
      ov.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
        ov.querySelectorAll("[data-h]").forEach(x => x.classList.remove("on")); b.classList.add("on");
        const h = list[+b.dataset.h]; sel = { v: h }; ov.querySelector("#hprev").textContent = h.content;
      });
      const okb = ov.querySelector("[data-ok]"); if (!list.length && okb) okb.disabled = true;
      ov.querySelector("[data-h]")?.click();
    }
  });
  if (!r || !items[d.id]) return;
  const cur = items[d.id];
  snapshot(cur, cur.content, "Visszaállítás előtti állapot");
  cur.content = r.v.content; cur.snapAt = Date.now(); save(cur.id);
  if (cur.trashedAt) restore(rootTrashOf(cur.id));
  $("#docPane").dataset.key = ""; render(); toast("A korábbi változat visszaállítva");
}

    { l: "Teljes export (JSON)", i: I.down, f: () => exportJson() }
  ];
  if (S.doc && items[S.doc] && !items[S.doc].trashedAt) acts.splice(2, 0,
    { l: "Fókusz mód", i: I.focus, f: () => setFocus(true) },
    { l: S.preview ? "Szerkesztő nézet" : "Olvasó nézet", i: I.edit, f: () => doAct(S.preview ? "edit" : "read") },
    { l: "Előzmények", i: I.hist, f: () => history(items[S.doc]) });
  let res = [];
  if (!q) {
    res = docs().sort((a, b) => b.modified - a.modified).slice(0, 5).map(d => ({ l: nameOf(d), s: rel(d.modified), i: I.doc, f: () => openDoc(d.id) })).concat(acts);
  } else {
    const ds = docs().filter(d => plainFold(d.name).includes(q) || plainFold(d.content).includes(q))
      .sort((a, b) => (plainFold(b.name).includes(q) - plainFold(a.name).includes(q)) || b.modified - a.modified).slice(0, 8);
    const fs = Object.values(items).filter(i => i.type === "folder" && live(i) && plainFold(i.name).includes(q)).slice(0, 4);
    const ts = allTags().filter(([t]) => plainFold(t).includes(q)).slice(0, 4);
    res = acts.filter(a => plainFold(a.l).includes(q))
      .concat(ds.map(d => ({ l: nameOf(d), s: pathOf(d), i: I.doc, f: () => { if (S.view === "trash") setView("folder"); openDoc(d.id); } })))
      .concat(fs.map(f => ({ l: nameOf(f), s: "Mappa", i: I.folder, f: () => goFolder(f.id) })))
      .concat(ts.map(([t, n]) => ({ l: "#" + t, s: `${n} jegyzet`, i: I.tag, f: () => setView("tag", { tag: t }) })));
  }
  palItems = res; palSel = 0;
  $("#palres").innerHTML = res.map((r, i) => `<button class="pi ${i === 0 ? "on" : ""}" data-pi="${i}" role="option">${r.i}<span>${esc(r.l)}</span>${r.s ? `<small>${esc(r.s)}</small>` : ""}</button>`).join("") ||
    '<div class="empty" style="padding:24px">Nincs találat</div>';
}
function palMove(n) {
  const bs = $("#palres").querySelectorAll(".pi"); if (!bs.length) return;
  palSel = (palSel + n + bs.length) % bs.length;
  bs.forEach((b, i) => b.classList.toggle("on", i === palSel)); bs[palSel].scrollIntoView({ block: "nearest" });
}
function palRun(i) { const it = palItems[i]; if (!it) return; palClose(); it.f(); }

/* ===== Események ===== */
document.addEventListener("click", e => {
  const t = e.target;
  const a = t.closest("a[data-url]"); if (a) { e.preventDefault(); openUrl(a.dataset.url); return; }
  const ck = t.closest("[data-check]"); if (ck) { toggleCheck(+ck.dataset.check); return; }
  const fm = t.closest("[data-fmt]"); if (fm) { fmtAct(fm.dataset.fmt); return; }
  const sg = t.closest("[data-seg]"); if (sg && draft) { draft[sg.dataset.seg] = sg.dataset.v; updateSetUI(); return; }
  const stp = t.closest("[data-step]"); if (stp && draft) { const dir = +stp.dataset.step, big = dir > 0 ? draft.trashDays >= 30 : draft.trashDays > 30; draft.trashDays = Math.min(90, Math.max(7, draft.trashDays + dir * (big ? 5 : 1))); updateSetUI(); return; }
  const tog = t.closest("[data-tog]"); if (tog) { const id = tog.dataset.tog; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderNav(); return; }
  const act = t.closest("[data-act]"); if (act) { doAct(act.dataset.act, act); return; }
  const op = t.closest("[data-open]"); if (op) { openDoc(op.dataset.open); return; }
  const tg = t.closest("[data-tag]"); if (tg && !t.closest("#ov")) { setView("tag", { tag: tg.dataset.tag }); return; }
  const v = t.closest("[data-view]"); if (v) { setView(v.dataset.view); return; }
  const go = t.closest("[data-go]"); if (go) { goFolder(go.dataset.go === "root" ? null : go.dataset.go); return; }
  if (t.id === "scrim") closeNav();
  if (t.id === "pal") palClose();
});
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    S.q = e.target.value;
    if (S.q.trim()) { if (S.view !== "search") { S.prevView = { view: S.view === "settings" ? "folder" : S.view, folder: S.folder, tag: S.tag }; } S.view = "search"; }
    else if (S.view === "search") Object.assign(S, S.prevView || { view: "folder" });
    renderList(); renderNav();
  }
  if (e.target.id === "palin") palRender();
});
$("#palin").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); palRun(palSel); }
  else if (e.key === "Escape") { e.preventDefault(); palClose(); }
});
$("#palres").addEventListener("click", e => { const b = e.target.closest("[data-pi]"); if (b) palRun(+b.dataset.pi); });
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); $("#pal").classList.contains("show") ? palClose() : palette(); return; }
  if (e.key === "Escape") {
    if (openMenu) { closeMenu(); return; }
    if (closeModal) { closeModal(null); return; }
    if ($("#pal").classList.contains("show")) { palClose(); return; }
    if (S.focus) { setFocus(false); return; }
    if ($("#nav").classList.contains("open")) { closeNav(); return; }
    if (e.target.id === "q" && S.q) { e.target.value = ""; e.target.dispatchEvent(new Event("input", { bubbles: true })); return; }
  }
  if (mod && e.key.toLowerCase() === "e" && S.doc && items[S.doc] && !items[S.doc].trashedAt && !closeModal) { e.preventDefault(); doAct(S.preview ? "edit" : "read"); }
});

/* Húzd és ejtsd: jegyzet vagy mappa áthelyezése egy mappára */
let dragId = null;
document.addEventListener("dragstart", e => { const d = e.target.closest?.("[data-drag]"); if (!d) return; dragId = d.dataset.drag; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", nameOf(items[dragId])); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); });
document.addEventListener("dragover", e => {
  if (!dragId) return;
  const z = e.target.closest("[data-drop]"); if (!z) return;
  const tgt = z.dataset.drop === "root" ? null : z.dataset.drop;
  if (tgt === dragId || (tgt && inside(tgt, dragId))) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drop").forEach(x => x !== z && x.classList.remove("drop"));
  if (z.id !== "list") z.classList.add("drop");
});
document.addEventListener("drop", e => {
  const z = e.target.closest("[data-drop]"); if (!z || !dragId) return;
  e.preventDefault();
  const tgt = z.dataset.drop === "root" ? null : z.dataset.drop, id = dragId;
  if (move(id, tgt)) { toast(`Áthelyezve ide: ${tgt ? nameOf(items[tgt]) : "Jegyzetek"}`); render(); }
});

window.addEventListener("online", () => { connect(); flush(); syncUI(); });
window.addEventListener("offline", syncUI);
window.addEventListener("resize", () => { if (!narrow()) $("#app").classList.toggle("docopen", !!S.doc); autosize(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) saveLocal(); else if (Date.now() - lastRemote > 60000 && conn !== "open") connect(); });
window.addEventListener("pagehide", saveLocal);

/* Android: vissza gomb, alvás előtti mentés, megosztott szöveg fogadása */
window.appBack = () => {
  if (openMenu) { closeMenu(); return true; }
  if (closeModal) { closeModal(null); return true; }
  if ($("#pal").classList.contains("show")) { palClose(); return true; }
  if (S.focus) { setFocus(false); return true; }
  if ($("#nav").classList.contains("open")) { closeNav(); return true; }
  if (S.view === "settings") { leaveSettings(); return true; }
  if (S.doc && narrow()) { S.doc = null; render(); return true; }
  if (S.view === "search") { S.q = ""; Object.assign(S, S.prevView || { view: "folder" }); render(); return true; }
  if (S.view !== "folder") { setView("folder"); return true; }
  if (S.folder !== null) { goFolder(items[S.folder] ? pid(items[S.folder]) : null); return true; }
  return false;
};
window.appPause = () => { saveLocal(); flush(); };
window.appShareIn = (subject, text) => {
  text = String(text || "").trim(); subject = String(subject || "").trim();
  if (!text && !subject) return;
  const first = text.split("\n")[0].slice(0, 80);
  const title = subject || (/^https?:\/\//.test(first) ? "Megosztott link" : first) || "Megosztott jegyzet";
  const id = create("doc", title, null, title === text ? "" : text);
  setView("folder", { folder: null }); openDoc(id);
  toast("A megosztott szöveg új jegyzetként mentve");
};

/* ===== Belépés ===== */
/* ===== Fiók: e-mail és jelszó (Firebase Authentication REST) ===== */
let session = null, refreshing = null, loggingOut = false;
const loadSession = () => { try { return JSON.parse(lsGet("millnotes.auth") || "null"); } catch (e) { return null; } };
function saveSession(x) { session = x; lsSet("millnotes.auth", JSON.stringify(x)); }
async function authPost(op, body) {
  const r = await fetch(AUTH_URL + op + "?key=" + CFG.apiKey, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, returnSecureToken: true }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || "HTTP " + r.status);
  return j;
}
// A Firebase jelszavas belépése e-mail-címet vár: a felhasználónévből belső cím lesz, levél nem megy rá.
const USER_DOMAIN = "millnotes.app";
const normUser = u => (u || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const USER_RE = /^[a-z0-9](?:[a-z0-9_-]|\.(?!\.)){1,28}[a-z0-9_-]$/;
const AUTH_ERR = {
  EMAIL_EXISTS: "Ez a felhasználónév már foglalt.",
  INVALID_LOGIN_CREDENTIALS: "Hibás felhasználónév vagy jelszó.",
  INVALID_PASSWORD: "Hibás felhasználónév vagy jelszó.",
  EMAIL_NOT_FOUND: "Hibás felhasználónév vagy jelszó.",
  INVALID_EMAIL: "Ez a felhasználónév nem használható.",
  WEAK_PASSWORD: "A jelszó legalább 6 karakter legyen.",
  USER_DISABLED: "Ez a fiók le van tiltva.",
  TOO_MANY_ATTEMPTS_TRY_LATER: "Túl sok próbálkozás. Próbáld meg később."
};
const authMsg = e => AUTH_ERR[e.message] || "Nem sikerült: " + e.message;
async function signIn(user, password, signup) {
  const j = await authPost(signup ? "signUp" : "signInWithPassword", { email: user + "@" + USER_DOMAIN, password });
  saveSession({ uid: j.localId, email: j.email, idToken: j.idToken, refreshToken: j.refreshToken, expiresAt: Date.now() + (+j.expiresIn) * 1000 });
}
async function ensureToken() {
  if (!session) throw new Error("NOSESSION");
  if (session.expiresAt - Date.now() > 60000) return;
  if (!refreshing) refreshing = (async () => {
    const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + CFG.apiKey, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(session.refreshToken) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error("REFRESH");
    saveSession({ ...session, idToken: j.id_token, refreshToken: j.refresh_token, expiresAt: Date.now() + (+j.expires_in) * 1000 });
  })().finally(() => { refreshing = null; });
  return refreshing;
}

function authGate() {
  return new Promise(res => {
    const g = document.createElement("div");
    g.className = "gate";
    let mode = "login";
    const draw = () => {
      const su = mode === "signup";
      g.innerHTML = `<div class="dlg" role="dialog" aria-label="${su ? "Új fiók" : "Bejelentkezés"}">${logo("run")}<h3>${su ? "Új fiók" : "Bejelentkezés"}</h3>
        <p>${su ? "Válassz felhasználónevet és jelszót. A jegyzeteid a fiókodhoz tartoznak, más nem látja őket." : "Ezzel a fiókkal bármelyik eszközön látod a jegyzeteidet."}</p>
        <input class="field" id="em" type="text" placeholder="Felhasználónév" autocomplete="username" autocapitalize="none" spellcheck="false" aria-label="Felhasználónév">
        <input class="field" id="pw" type="password" placeholder="Jelszó (legalább 6 karakter)" autocomplete="${su ? "new-password" : "current-password"}" aria-label="Jelszó">
        ${su ? `<input class="field" id="pw2" type="password" placeholder="Jelszó még egyszer" autocomplete="new-password" aria-label="Jelszó még egyszer">
        <div class="warnbox" style="margin-top:12px">Jegyezd fel a jelszót: e-mail-cím nélkül nem lehet visszaállítani.</div>` : ""}
        <div id="gerr" class="warnbox" style="display:none;margin-top:10px;color:#fda4af;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.08)"></div>
        <div class="row2" style="justify-content:space-between;margin-top:16px">
          <button class="btn ghost" id="tg">${su ? "Van már fiókom" : "Új fiók"}</button>
          <button class="btn pri" id="go">${su ? "Létrehozás" : "Belépés"}</button>
        </div></div>`;
      const em = g.querySelector("#em"), pw = g.querySelector("#pw"), pw2 = g.querySelector("#pw2"), go = g.querySelector("#go");
      const showErr = m => { const b = g.querySelector("#gerr"); b.textContent = m; b.style.display = "block"; };
      em.focus();
      g.querySelector("#tg").onclick = () => { mode = su ? "login" : "signup"; draw(); };
      const submit = async () => {
        const u = normUser(em.value), p = pw.value;
        if (!USER_RE.test(u)) return showErr("A felhasználónév 3–30 karakter legyen: betű, szám, pont, kötőjel vagy aláhúzás.");
        if (p.length < 6) return showErr("A jelszó legalább 6 karakter legyen.");
        if (su && pw2.value !== p) return showErr("A két jelszó nem egyezik.");
        go.disabled = true;
        try { await signIn(u, p, su); g.remove(); res(); }
        catch (x) { go.disabled = false; showErr(authMsg(x)); }
      };
      go.onclick = submit;
      [em, pw, pw2].forEach(f => f && (f.onkeydown = e => { if (e.key === "Enter") submit(); }));
    };
    document.body.appendChild(g);
    draw();
  });
}

async function init() {
  session = loadSession();
  if (!session || !session.uid) await authGate();
  try { await ensureToken(); }
  catch (e) { if (e.message === "REFRESH") { lsDel("millnotes.auth"); session = null; await authGate(); } }   // a fiók lejárt: új belépés kell, a helyi adatok megmaradnak
  hash = session.uid;
  loadConf(); loadLocal();
  shell(); render(); syncUI();
  connect();
  if (pending()) flush();
  setInterval(() => { purge(); fetchConf(); if (S.view !== "search") renderListSoon(); }, 60000);
  try { if (window.AndroidBridge && AndroidBridge.takeShared) { const s = JSON.parse(AndroidBridge.takeShared() || "null"); if (s) appShareIn(s.subject, s.text); } } catch (e) {}
}
init();
</script>
